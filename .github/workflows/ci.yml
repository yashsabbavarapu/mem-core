name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy --strict memcore tests
      - run: pytest -v
      - run: python -m memcore.cli pack --turns 10 --budget 500 --no-show-prompt

  # The heuristic counter and the real BPE counter pack differently, and the
  # budget guarantee has to hold under both. The matrix above installs only
  # [dev] (no tiktoken), so this leg covers the tokenizer path.
  tokenizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,tokenizer]"
      - run: pytest -q
